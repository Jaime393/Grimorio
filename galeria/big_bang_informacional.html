<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Bang Informacional - MIU v13.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        .container {
            position: relative;
            width: 1200px;
            height: 800px;
            background: #0B0C10;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.2), 0 0 120px rgba(26, 35, 126, 0.15);
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .info-overlay {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(255, 215, 0, 0.7);
            font-size: 12px;
            text-align: right;
            font-family: 'Courier New', monospace;
        }
        
        .pulse-indicator {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 215, 0, 0.6);
            font-size: 13px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
<style>
#gal-backnav{position:fixed;top:12px;left:12px;z-index:99999;display:flex;gap:6px;font-family:'Courier New',monospace;font-size:11px;}
#gal-backnav a{color:#ffd700;text-decoration:none;background:rgba(10,10,15,0.7);border:1px solid rgba(255,215,0,0.35);border-radius:6px;padding:5px 10px;backdrop-filter:blur(4px);transition:all .2s;}
#gal-backnav a:hover{background:rgba(255,215,0,0.15);border-color:#ffd700;}
</style>
<div id="gal-backnav"><a href="index.html">← Galería</a><a href="../index.html">Inicio</a></div>

    <div class="container">
        <canvas id="cosmicCanvas"></canvas>
        <div class="pulse-indicator">
            <span>▶ Latido Cósmico Iniciado</span>
            <div style="font-size: 11px; margin-top: 5px; color: rgba(255, 215, 0, 0.4)">
                Observando: ρ(x) → Ω
            </div>
        </div>
        <div class="info-overlay">
            <div>MIU-IFT v13.0</div>
            <div style="font-size: 11px; margin-top: 3px; color: rgba(255, 215, 0, 0.5)">
                El Big Bang es el primer latido
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('cosmicCanvas');
        const ctx = canvas.getContext('2d');
        
        // Configurar canvas
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        
        // Variables de animación
        let time = 0;
        const phi = 1.618033988749;
        
        // Constantes MIU
        const constants = {
            q_born: 1.1910149,
            phi_c: 0.6829322,
            delta_cod: 0.6829322,
            omega_f: 0.65048305,
            xi: 8.57,
            K_i: phi * (0.6829322 / 2.5)
        };
        
        // Función para crear degradado radial
        function createRadialGradient(x, y, r1, r2, colors) {
            const grad = ctx.createRadialGradient(x, y, r1, x, y, r2);
            for (let i = 0; i < colors.length; i++) {
                grad.addColorStop(i / (colors.length - 1), colors[i]);
            }
            return grad;
        }
        
        // Dibujar espirales áureas de fondo
        function drawGoldenSpirals() {
            ctx.strokeStyle = 'rgba(184, 134, 11, 0.08)';
            ctx.lineWidth = 1;
            
            for (let spiral = 0; spiral < 4; spiral++) {
                ctx.beginPath();
                const rotation = (spiral * Math.PI / 2);
                
                for (let i = 0; i < 200; i++) {
                    const theta = (i / 10) + rotation;
                    const radius = 20 * Math.pow(phi, theta / Math.PI);
                    const x = centerX + radius * Math.cos(theta);
                    const y = centerY + radius * Math.sin(theta);
                    
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                    
                    if (radius > 350) break;
                }
                ctx.stroke();
            }
        }
        
        // Dibujar núcleo central pulsante
        function drawCoreNucleus() {
            const pulseScale = 1 + 0.15 * Math.sin(time * 0.03);
            const coreRadius = 35 * pulseScale;
            
            // Núcleo dorado interior
            const coreGrad = createRadialGradient(
                centerX, centerY, 0, coreRadius,
                ['#FFFFFF', '#FFD700', '#FFA500', 'rgba(255, 215, 0, 0.3)']
            );
            
            ctx.fillStyle = coreGrad;
            ctx.beginPath();
            ctx.arc(centerX, centerY, coreRadius, 0, Math.PI * 2);
            ctx.fill();
            
            // Brillo exterior del núcleo
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(centerX, centerY, coreRadius, 0, Math.PI * 2);
            ctx.stroke();
            
            // Valores numéricos en el núcleo
            ctx.fillStyle = 'rgba(255, 215, 0, 0.9)';
            ctx.font = 'bold 11px "Courier New"';
            ctx.textAlign = 'center';
            ctx.fillText(`q_born = ${constants.q_born}`, centerX, centerY - 5);
            ctx.fillText(`Φ_c = ${constants.phi_c}`, centerX, centerY + 10);
        }
        
        // Dibujar onda de choque esférica
        function drawShockWave() {
            const waveRadius = 60 + (time * 0.8) % 300;
            const waveWidth = 15;
            
            // Gradiente de onda
            const waveGrad = createRadialGradient(
                centerX, centerY, 
                waveRadius - waveWidth, 
                waveRadius + waveWidth,
                [
                    'rgba(26, 35, 126, 0.8)',
                    'rgba(255, 215, 0, 0.6)',
                    'rgba(255, 255, 255, 0.4)',
                    'rgba(26, 35, 126, 0.1)'
                ]
            );
            
            ctx.fillStyle = waveGrad;
            ctx.beginPath();
            ctx.arc(centerX, centerY, waveRadius + waveWidth, 0, Math.PI * 2);
            ctx.arc(centerX, centerY, waveRadius - waveWidth, 0, Math.PI * 2, true);
            ctx.fill();
        }
        
        // Dibujar anillos concéntricos
        function drawConcentriRings() {
            const rings = [
                { radius: 120, color: 'rgba(255, 165, 0, 0.4)', label: 'Plasma Primordial' },
                { radius: 180, color: 'rgba(255, 140, 0, 0.35)', label: 'Primeros Átomos' },
                { radius: 250, color: 'rgba(100, 150, 255, 0.3)', label: 'Primeras Estrellas' },
                { radius: 320, color: 'rgba(123, 31, 162, 0.25)', label: 'Estructura Cósmica' }
            ];
            
            for (let ring of rings) {
                ctx.strokeStyle = ring.color;
                ctx.lineWidth = 20;
                ctx.beginPath();
                ctx.arc(centerX, centerY, ring.radius, 0, Math.PI * 2);
                ctx.stroke();
            }
        }
        
        // Dibujar partículas en anillo 1
        function drawPrimalParticles() {
            const particleRadius = 120;
            const particleCount = 8;
            const colors = ['#FF3333', '#33FF33', '#3333FF'];
            
            for (let i = 0; i < particleCount; i++) {
                const angle = (i / particleCount) * Math.PI * 2 + time * 0.01;
                const x = centerX + particleRadius * Math.cos(angle);
                const y = centerY + particleRadius * Math.sin(angle);
                
                // Pequeñas esferas de partículas
                const grad = createRadialGradient(x - 3, y - 3, 0, 8, [
                    colors[i % colors.length],
                    'rgba(255, 255, 255, 0.8)',
                    'rgba(255, 255, 255, 0)'
                ]);
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // Dibujar filamentos de información (fractal)
        function drawInformationFilaments() {
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.6)';
            ctx.lineWidth = 1.5;
            
            const filamentCount = 12;
            const maxLength = 320;
            
            for (let f = 0; f < filamentCount; f++) {
                const baseAngle = (f / filamentCount) * Math.PI * 2;
                
                ctx.beginPath();
                const startX = centerX + 40 * Math.cos(baseAngle);
                const startY = centerY + 40 * Math.sin(baseAngle);
                ctx.moveTo(startX, startY);
                
                // Crear filamento fractal
                for (let i = 0; i < 100; i++) {
                    const t = i / 100;
                    const radius = 40 + maxLength * t;
                    const angle = baseAngle + Math.sin(t * Math.PI * 3 + time * 0.02) * 0.3;
                    
                    const x = centerX + radius * Math.cos(angle);
                    const y = centerY + radius * Math.sin(angle);
                    ctx.lineTo(x, y);
                }
                ctx.stroke();
                
                // Nodos brillantes en los filamentos
                ctx.fillStyle = 'rgba(255, 215, 0, 0.8)';
                for (let n = 0; n < 4; n++) {
                    const t = (n + 1) / 5;
                    const radius = 40 + maxLength * t;
                    const angle = baseAngle + Math.sin(t * Math.PI * 3 + time * 0.02) * 0.3;
                    
                    const x = centerX + radius * Math.cos(angle);
                    const y = centerY + radius * Math.sin(angle);
                    
                    const nodeGrad = createRadialGradient(x - 2, y - 2, 0, 6, [
                        'rgba(255, 255, 255, 0.9)',
                        'rgba(255, 215, 0, 0.5)',
                        'rgba(255, 215, 0, 0)'
                    ]);
                    
                    ctx.fillStyle = nodeGrad;
                    ctx.beginPath();
                    ctx.arc(x, y, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
        
        // Dibujar galaxias espirales
        function drawGalaxies() {
            const galaxyRadius = 280;
            const galaxyCount = 5;
            
            for (let g = 0; g < galaxyCount; g++) {
                const angle = (g / galaxyCount) * Math.PI * 2;
                const gx = centerX + galaxyRadius * Math.cos(angle);
                const gy = centerY + galaxyRadius * Math.sin(angle);
                
                // Disco galáctico
                const galaxyGrad = createRadialGradient(gx, gy, 5, 25, [
                    'rgba(255, 215, 0, 0.9)',
                    'rgba(100, 150, 255, 0.6)',
                    'rgba(100, 150, 255, 0.1)'
                ]);
                
                ctx.fillStyle = galaxyGrad;
                ctx.beginPath();
                ctx.arc(gx, gy, 25, 0, Math.PI * 2);
                ctx.fill();
                
                // Brazos espirales
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.4)';
                ctx.lineWidth = 1;
                for (let arm = 0; arm < 2; arm++) {
                    ctx.beginPath();
                    const armAngle = arm * Math.PI + time * 0.01;
                    
                    for (let r = 0; r < 20; r++) {
                        const spiralR = r;
                        const spiralAngle = armAngle + (r / 20) * Math.PI;
                        const x = gx + spiralR * Math.cos(spiralAngle);
                        const y = gy + spiralR * Math.sin(spiralAngle);
                        
                        if (r === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                }
            }
        }
        
        // Dibujar anotaciones
        function drawAnnotations() {
            ctx.fillStyle = 'rgba(255, 215, 0, 0.7)';
            ctx.font = '12px "Courier New"';
            
            // Esquina superior izquierda
            ctx.textAlign = 'left';
            ctx.fillText(`Δ_COD = ${constants.delta_cod}`, 30, 40);
            ctx.fillText('(gap cuántico)', 30, 56);
            
            // Esquina superior derecha
            ctx.textAlign = 'right';
            ctx.fillText(`Ω_F = ${constants.omega_f} Hz`, canvas.width - 30, 40);
            ctx.fillText('(frecuencia Fisher)', canvas.width - 30, 56);
            
            // Esquina inferior izquierda
            ctx.textAlign = 'left';
            ctx.fillText(`ξ = ${constants.xi} ± 0.28`, 30, canvas.height - 20);
            ctx.fillText('(acoplamiento no-mínimo)', 30, canvas.height - 4);
            
            // Esquina inferior derecha
            ctx.textAlign = 'right';
            ctx.fillText(`K_i = φ·D_f/2.5`, canvas.width - 30, canvas.height - 20);
            ctx.fillText('(R²=0.989, p<10⁻⁴⁸)', canvas.width - 30, canvas.height - 4);
            
            // Centro inferior
            ctx.textAlign = 'center';
            ctx.fillStyle = 'rgba(255, 215, 0, 0.5)';
            ctx.font = 'italic 11px "Courier New"';
            ctx.fillText('ρ(x) > 0 — La información se expande', centerX, canvas.height - 40);
        }
        
        // Función de animación principal
        function animate() {
            // Limpiar canvas con efecto de rastro
            ctx.fillStyle = 'rgba(11, 12, 16, 0.95)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Dibujar en orden
            drawGoldenSpirals();
            drawConcentriRings();
            drawShockWave();
            drawPrimalParticles();
            drawInformationFilaments();
            drawGalaxies();
            drawCoreNucleus();
            drawAnnotations();
            
            time++;
            requestAnimationFrame(animate);
        }
        
        // Iniciar animación
        animate();
        
        // Responsividad
        window.addEventListener('resize', () => {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        });
    </script>
</body>
</html>
