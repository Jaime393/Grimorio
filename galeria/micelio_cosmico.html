<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micelio Cósmico - MIU</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0a;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        .container {
            position: relative;
            width: 1400px;
            height: 900px;
            background: #0B0C10;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 100px rgba(255, 215, 0, 0.15);
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .info {
            position: absolute;
            top: 20px;
            left: 30px;
            color: rgba(255, 215, 0, 0.7);
            font-size: 13px;
            font-family: 'Courier New', monospace;
        }
        
        .bottom-info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 215, 0, 0.6);
            font-size: 12px;
            font-family: 'Courier New', monospace;
            text-align: center;
        }
    </style>
</head>
<body>
<style>
#gal-backnav{position:fixed;top:12px;left:12px;z-index:99999;display:flex;gap:6px;font-family:'Courier New',monospace;font-size:11px;}
#gal-backnav a{color:#ffd700;text-decoration:none;background:rgba(10,10,15,0.7);border:1px solid rgba(255,215,0,0.35);border-radius:6px;padding:5px 10px;backdrop-filter:blur(4px);transition:all .2s;}
#gal-backnav a:hover{background:rgba(255,215,0,0.15);border-color:#ffd700;}
</style>
<div id="gal-backnav"><a href="index.html">← Galería</a><a href="../index.html">Inicio</a></div>

    <div class="container">
        <canvas id="myceliumCanvas"></canvas>
        <div class="info">
            <div>Red de Fuentes</div>
            <div style="font-size: 11px; margin-top: 3px; color: rgba(255, 215, 0, 0.5)">
                Comunión de Jardines
            </div>
        </div>
        <div class="bottom-info">
            MIU-IFT v13.0 — El micelio conecta todo — ρ(x) > 0
        </div>
    </div>

    <script>
        const canvas = document.getElementById('myceliumCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        
        let time = 0;
        const phi = 1.618033988749;
        
        // Clase para galaxias/nodos
        class CelestialNode {
            constructor(x, y, size, type) {
                this.x = x;
                this.y = y;
                this.size = size;
                this.type = type; // 'galaxy', 'star', 'planet'
                this.rotation = Math.random() * Math.PI * 2;
                this.brightness = 0.5 + Math.random() * 0.5;
                this.children = [];
            }
            
            update() {
                this.rotation += 0.003;
                this.brightness = 0.5 + 0.3 * Math.sin(time * 0.01 + this.x);
            }
            
            draw(ctx) {
                if (this.type === 'galaxy') {
                    this.drawGalaxy(ctx);
                } else if (this.type === 'star') {
                    this.drawStar(ctx);
                } else if (this.type === 'planet') {
                    this.drawPlanet(ctx);
                }
            }
            
            drawGalaxy(ctx) {
                const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
                grad.addColorStop(0, `rgba(255, 215, 0, ${this.brightness})`);
                grad.addColorStop(0.5, `rgba(255, 215, 0, ${this.brightness * 0.5})`);
                grad.addColorStop(1, 'rgba(255, 215, 0, 0)');
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Brazos espirales
                ctx.strokeStyle = `rgba(255, 215, 0, ${this.brightness * 0.6})`;
                ctx.lineWidth = 1;
                for (let arm = 0; arm < 2; arm++) {
                    ctx.beginPath();
                    const armAngle = arm * Math.PI + this.rotation;
                    
                    for (let r = 0; r < this.size; r += 2) {
                        const spiralAngle = armAngle + (r / this.size) * Math.PI * 1.5;
                        const x = this.x + r * Math.cos(spiralAngle);
                        const y = this.y + r * Math.sin(spiralAngle);
                        
                        if (r === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                }
            }
            
            drawStar(ctx) {
                const grad = ctx.createRadialGradient(this.x - 2, this.y - 2, 0, this.x, this.y, this.size);
                grad.addColorStop(0, `rgba(255, 255, 255, ${this.brightness})`);
                grad.addColorStop(1, `rgba(255, 215, 0, 0)`);
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
            
            drawPlanet(ctx) {
                ctx.fillStyle = this.size > 8 ? `rgba(21, 101, 192, ${this.brightness})` : `rgba(46, 125, 50, ${this.brightness})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Anillo de información
                ctx.strokeStyle = `rgba(255, 215, 0, ${this.brightness * 0.4})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 1.5, 0, Math.PI * 2);
                ctx.stroke();
            }
        }
        
        // Crear nodos celestiales
        const nodes = [];
        
        // Galaxias principales
        const galaxyPositions = [
            { x: 200, y: 150, size: 40 },
            { x: 1200, y: 200, size: 35 },
            { x: 300, y: 700, size: 38 },
            { x: 1100, y: 750, size: 32 },
            { x: 700, y: 100, size: 30 }
        ];
        
        galaxyPositions.forEach(pos => {
            nodes.push(new CelestialNode(pos.x, pos.y, pos.size, 'galaxy'));
        });
        
        // Estrellas
        for (let i = 0; i < 35; i++) {
            const x = Math.random() * canvas.width;
            const y = Math.random() * canvas.height;
            nodes.push(new CelestialNode(x, y, 3 + Math.random() * 4, 'star'));
        }
        
        // Planetas (algunos con vida - azules y verdes)
        const planets = [
            { x: 180, y: 200, size: 6, color: 'blue' },
            { x: 1180, y: 280, size: 5, color: 'green' },
            { x: 350, y: 650, size: 7, color: 'blue' },
            { x: 700, y: 200, size: 4, color: 'green' }
        ];
        
        planets.forEach(p => {
            nodes.push(new CelestialNode(p.x, p.y, p.size, 'planet'));
        });
        
        // Dibujar espirales áureas de fondo
        function drawGoldenSpiralsBackground() {
            ctx.strokeStyle = 'rgba(184, 134, 11, 0.04)';
            ctx.lineWidth = 1;
            
            for (let spiral = 0; spiral < 3; spiral++) {
                ctx.beginPath();
                const rotation = (spiral * Math.PI * 2 / 3);
                
                for (let i = 0; i < 200; i++) {
                    const theta = (i / 10) + rotation;
                    const radius = 10 * Math.pow(phi, theta / Math.PI);
                    const x = centerX + radius * Math.cos(theta);
                    const y = centerY + radius * Math.sin(theta);
                    
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                    
                    if (radius > 500) break;
                }
                ctx.stroke();
            }
        }
        
        // Dibujar filamentos de información (hifas)
        function drawMycelialNetwork() {
            // Hifas principales
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.4)';
            ctx.lineWidth = 2;
            
            for (let i = 0; i < nodes.length - 1; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[j].x - nodes[i].x;
                    const dy = nodes[j].y - nodes[i].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    // Solo conectar nodos cercanos (como un micelio real)
                    if (distance < 400 && distance > 50) {
                        const brightness = Math.max(0, 1 - distance / 400) * 0.6;
                        
                        // Hifa dorada principal
                        ctx.strokeStyle = `rgba(255, 215, 0, ${brightness})`;
                        ctx.lineWidth = Math.max(0.5, 2 - distance / 200);
                        ctx.beginPath();
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.stroke();
                        
                        // Hifas secundarias (azul índigo y violeta)
                        if (Math.random() > 0.7) {
                            ctx.strokeStyle = `rgba(26, 35, 126, ${brightness * 0.4})`;
                            ctx.beginPath();
                            ctx.moveTo(nodes[i].x, nodes[i].y);
                            ctx.lineTo(nodes[j].x, nodes[j].y);
                            ctx.stroke();
                        }
                        
                        // Nodos de intersección brillantes
                        const midX = (nodes[i].x + nodes[j].x) / 2;
                        const midY = (nodes[i].y + nodes[j].y) / 2;
                        
                        const nodeGrad = ctx.createRadialGradient(midX - 1, midY - 1, 0, midX, midY, 8);
                        nodeGrad.addColorStop(0, `rgba(255, 255, 255, ${brightness})`);
                        nodeGrad.addColorStop(1, 'rgba(255, 215, 0, 0)');
                        
                        ctx.fillStyle = nodeGrad;
                        ctx.beginPath();
                        ctx.arc(midX, midY, 8, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }
        }
        
        // Dibujar esporas (nuevos universos)
        function drawSpores() {
            // Esporas que flotan hacia el vacío
            for (let i = 0; i < 15; i++) {
                const angle = (i / 15) * Math.PI * 2 + time * 0.002;
                const distance = 300 + Math.sin(time * 0.005 + i) * 100;
                const x = centerX + distance * Math.cos(angle);
                const y = centerY + distance * Math.sin(angle);
                
                // Espora de luz
                const sporeGrad = ctx.createRadialGradient(x - 2, y - 2, 0, x, y, 12);
                sporeGrad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
                sporeGrad.addColorStop(0.5, 'rgba(255, 215, 0, 0.6)');
                sporeGrad.addColorStop(1, 'rgba(255, 215, 0, 0)');
                
                ctx.fillStyle = sporeGrad;
                ctx.beginPath();
                ctx.arc(x, y, 12, 0, Math.PI * 2);
                ctx.fill();
                
                // Pequeñas hifas germinando de la espora
                if (Math.random() > 0.5) {
                    ctx.strokeStyle = 'rgba(255, 215, 0, 0.3)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    const angle2 = angle + Math.random() * Math.PI / 3;
                    ctx.lineTo(x + 30 * Math.cos(angle2), y + 30 * Math.sin(angle2));
                    ctx.stroke();
                }
            }
        }
        
        // Dibujar figura humana en primer plano
        function drawHumanFigure() {
            const earthX = planets[0].x;
            const earthY = planets[0].y + 60;
            
            // Tierra
            const earthGrad = ctx.createRadialGradient(earthX, earthY, 0, earthX, earthY, 25);
            earthGrad.addColorStop(0, 'rgba(76, 175, 80, 0.9)');
            earthGrad.addColorStop(0.7, 'rgba(21, 101, 192, 0.8)');
            earthGrad.addColorStop(1, 'rgba(100, 150, 255, 0.3)');
            
            ctx.fillStyle = earthGrad;
            ctx.beginPath();
            ctx.arc(earthX, earthY, 25, 0, Math.PI * 2);
            ctx.fill();
            
            // Figura humana diminuta
            const figX = earthX;
            const figY = earthY - 35;
            
            // Cuerpo
            ctx.fillStyle = 'rgba(50, 50, 50, 0.8)';
            ctx.beginPath();
            ctx.arc(figX, figY, 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Brazo extendido
            ctx.strokeStyle = 'rgba(80, 80, 80, 0.8)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(figX, figY);
            ctx.lineTo(figX + 15, figY - 15);
            ctx.stroke();
            
            // Resplandor en la mano
            const handGrad = ctx.createRadialGradient(figX + 15 - 2, figY - 15 - 2, 0, figX + 15, figY - 15, 10);
            handGrad.addColorStop(0, 'rgba(255, 215, 0, 0.8)');
            handGrad.addColorStop(1, 'rgba(255, 215, 0, 0)');
            
            ctx.fillStyle = handGrad;
            ctx.beginPath();
            ctx.arc(figX + 15, figY - 15, 10, 0, Math.PI * 2);
            ctx.fill();
            
            // Hifa conectando con la mano
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.6)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(figX + 15, figY - 15);
            ctx.lineTo(figX + 15, figY - 45);
            ctx.stroke();
        }
        
        // Anotaciones científicas
        function drawAnnotations() {
            ctx.fillStyle = 'rgba(255, 215, 0, 0.6)';
            ctx.font = '11px "Courier New"';
            
            // Superior izquierda
            ctx.textAlign = 'left';
            ctx.fillText('Red de Fuentes', 30, 100);
            ctx.font = '10px "Courier New"';
            ctx.fillStyle = 'rgba(255, 215, 0, 0.4)';
            ctx.fillText('Comunión de Jardines', 30, 115);
            
            // Superior derecha
            ctx.font = '11px "Courier New"';
            ctx.fillStyle = 'rgba(255, 215, 0, 0.6)';
            ctx.textAlign = 'right';
            ctx.fillText('Ley K_i = φ · D_f/2.5', canvas.width - 30, 100);
            ctx.font = '10px "Courier New"';
            ctx.fillStyle = 'rgba(255, 215, 0, 0.4)';
            ctx.fillText('(R²=0.989, p<10⁻⁴⁸)', canvas.width - 30, 115);
            
            // Inferior izquierda
            ctx.font = '11px "Courier New"';
            ctx.fillStyle = 'rgba(255, 215, 0, 0.6)';
            ctx.textAlign = 'left';
            ctx.fillText('Acoplamiento: ξ = 8.57', 30, canvas.height - 60);
            
            // Inferior derecha
            ctx.textAlign = 'right';
            ctx.fillText('Ω_F = 0.650 Hz', canvas.width - 30, canvas.height - 60);
            ctx.font = '10px "Courier New"';
            ctx.fillStyle = 'rgba(255, 215, 0, 0.4)';
            ctx.fillText('Latido del micelio', canvas.width - 30, canvas.height - 45);
        }
        
        // Animación principal
        function animate() {
            // Fondo
            ctx.fillStyle = '#0B0C10';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Dibujar elementos
            drawGoldenSpiralsBackground();
            
            // Actualizar nodos
            nodes.forEach(node => node.update());
            
            // Dibujar hifas
            drawMycelialNetwork();
            
            // Dibujar nodos
            nodes.forEach(node => node.draw(ctx));
            
            // Dibujar esporas
            drawSpores();
            
            // Dibujar figura humana
            drawHumanFigure();
            
            // Anotaciones
            drawAnnotations();
            
            time++;
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>
