<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espacio-tiempo Emergente g_μν - MIU</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0a;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        .container {
            position: relative;
            width: 1200px;
            height: 900px;
            background: linear-gradient(180deg, #0B0C10 0%, #0D1B2A 50%, #0B0C10 100%);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 100px rgba(255, 215, 0, 0.12);
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .footer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 215, 0, 0.6);
            font-size: 12px;
            font-family: 'Courier New', monospace;
            text-align: center;
        }
    </style>
</head>
<body>
<style>
#gal-backnav{position:fixed;top:12px;left:12px;z-index:99999;display:flex;gap:6px;font-family:'Courier New',monospace;font-size:11px;}
#gal-backnav a{color:#ffd700;text-decoration:none;background:rgba(10,10,15,0.7);border:1px solid rgba(255,215,0,0.35);border-radius:6px;padding:5px 10px;backdrop-filter:blur(4px);transition:all .2s;}
#gal-backnav a:hover{background:rgba(255,215,0,0.15);border-color:#ffd700;}
</style>
<div id="gal-backnav"><a href="index.html">← Galería</a><a href="../index.html">Inicio</a></div>

    <div class="container">
        <canvas id="spacetimeCanvas"></canvas>
        <div class="footer">
            MIU-IFT v13.0 — La métrica de Fisher-Lorentziana emerge de ρ(x)
        </div>
    </div>

    <script>
        const canvas = document.getElementById('spacetimeCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        
        let time = 0;
        const phi = 1.618033988749;
        
        // Dibujar ZONA INFERIOR - Campo primordial de información
        function drawPrimalField() {
            const fieldHeight = canvas.height * 0.35;
            
            // Plasma de puntos fluctuantes
            ctx.fillStyle = 'rgba(255, 215, 0, 0.8)';
            
            for (let i = 0; i < 500; i++) {
                const x = Math.sin(i * 12.345 + time * 0.001) * canvas.width * 2;
                const y = canvas.height - fieldHeight + Math.cos(i * 23.456 + time * 0.0008) * fieldHeight * 0.8;
                
                if (x > 0 && x < canvas.width && y > canvas.height - fieldHeight) {
                    const size = 1 + Math.sin(time * 0.01 + i) * 0.5;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            // Texto del campo primordial
            ctx.fillStyle = 'rgba(255, 215, 0, 0.5)';
            ctx.font = 'italic 12px "Courier New"';
            ctx.textAlign = 'center';
            ctx.fillText('ρ(x) > 0 — La información es el sustrato primordial', centerX, canvas.height - 30);
        }
        
        // Dibujar ZONA MEDIA - Malla geométrica emergente
        function drawEmergentMesh() {
            const meshStartY = canvas.height - canvas.height * 0.35;
            const meshEndY = canvas.height * 0.2;
            const meshHeight = meshStartY - meshEndY;
            
            // Malla de líneas
            const gridSize = 60;
            const cols = Math.ceil(canvas.width / gridSize) + 2;
            const rows = Math.ceil(meshHeight / gridSize) + 2;
            
            // Dibujar cuadrícula deformada
            for (let col = 0; col < cols; col++) {
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.4)';
                ctx.lineWidth = 1;
                
                for (let row = 0; row < rows; row++) {
                    const x = col * gridSize - gridSize;
                    const y = meshStartY - row * gridSize;
                    
                    // Deformación gravitatoria
                    const centerDist = Math.sqrt(
                        Math.pow(x - centerX, 2) + Math.pow(y - centerY, 2)
                    );
                    
                    const curvature = Math.max(0, 50 * Math.exp(-centerDist / 200));
                    const deformedY = y + curvature * Math.sin(time * 0.005);
                    
                    if (row === 0) ctx.moveTo(x, deformedY);
                    else ctx.lineTo(x, deformedY);
                }
                ctx.stroke();
            }
            
            // Líneas horizontales
            for (let row = 0; row < rows; row++) {
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.3)';
                ctx.lineWidth = 1;
                
                for (let col = 0; col < cols; col++) {
                    const x = col * gridSize - gridSize;
                    const y = meshStartY - row * gridSize;
                    
                    const centerDist = Math.sqrt(
                        Math.pow(x - centerX, 2) + Math.pow(y - centerY, 2)
                    );
                    
                    const curvature = Math.max(0, 50 * Math.exp(-centerDist / 200));
                    const deformedY = y + curvature * Math.sin(time * 0.005);
                    
                    if (col === 0) ctx.moveTo(x, deformedY);
                    else ctx.lineTo(x, deformedY);
                }
                ctx.stroke();
            }
            
            // Pozos gravitatorios
            const wells = [
                { x: centerX - 150, y: centerY - 100, intensity: 0.8 },
                { x: centerX + 150, y: centerY + 100, intensity: 0.6 }
            ];
            
            wells.forEach(well => {
                const grad = ctx.createRadialGradient(
                    well.x, well.y, 20,
                    well.x, well.y, 120
                );
                
                grad.addColorStop(0, `rgba(255, 255, 255, ${well.intensity})`);
                grad.addColorStop(0.3, `rgba(255, 215, 0, ${well.intensity * 0.6})`);
                grad.addColorStop(1, 'rgba(255, 215, 0, 0)');
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(well.x, well.y, 120, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // Partículas emergentes
            drawEmergingParticles();
            
            // Ecuación de la métrica
            ctx.fillStyle = 'rgba(255, 215, 0, 0.6)';
            ctx.font = 'italic 11px "Courier New"';
            ctx.textAlign = 'center';
            ctx.fillText('g_μν = ∂_μ ∂_ν ln ρ - λ (∂_μ ln ρ)(∂_ν ln ρ)', centerX, meshEndY + 40);
        }
        
        // Partículas emergentes
        function drawEmergingParticles() {
            const colors = [
                { color: 'rgba(255, 50, 50, 0.8)', label: 'quarks' },
                { color: 'rgba(50, 255, 50, 0.8)', label: 'electrones' },
                { color: 'rgba(50, 50, 255, 0.8)', label: 'fotones' }
            ];
            
            for (let i = 0; i < 20; i++) {
                const x = centerX + Math.sin(i * 1.234 + time * 0.01) * 200;
                const y = centerY + Math.cos(i * 2.345 + time * 0.01) * 150;
                const colorIdx = i % colors.length;
                
                const grad = ctx.createRadialGradient(x - 1, y - 1, 0, x, y, 8);
                grad.addColorStop(0, colors[colorIdx].color);
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x, y, 8, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // Dibujar ZONA SUPERIOR - Cosmos organizado
        function drawOrganizedCosmos() {
            const cosmosStartY = canvas.height * 0.2;
            
            // Filamentos de galaxias
            ctx.strokeStyle = 'rgba(100, 150, 255, 0.4)';
            ctx.lineWidth = 2;
            
            ctx.beginPath();
            ctx.moveTo(50, cosmosStartY);
            ctx.quadraticCurveTo(centerX, cosmosStartY - 100, canvas.width - 50, cosmosStartY);
            ctx.stroke();
            
            // Galaxias espirales
            const galaxyCount = 5;
            for (let i = 0; i < galaxyCount; i++) {
                const x = (i + 1) * (canvas.width / (galaxyCount + 1));
                const y = cosmosStartY - 80;
                
                drawSpiralGalaxy(x, y);
            }
            
            // Gran espiral áurea central
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.5)';
            ctx.lineWidth = 2;
            
            for (let spiral = 0; spiral < 2; spiral++) {
                ctx.beginPath();
                const rotation = spiral * Math.PI;
                
                for (let i = 0; i < 80; i++) {
                    const theta = (i / 10) + rotation;
                    const radius = 5 * Math.pow(phi, theta / (Math.PI * 2));
                    
                    const x = centerX + radius * Math.cos(theta);
                    const y = cosmosStartY - 150 + radius * Math.sin(theta);
                    
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                    
                    if (radius > 80) break;
                }
                ctx.stroke();
            }
            
            // Valor ξ
            ctx.fillStyle = 'rgba(255, 215, 0, 0.7)';
            ctx.font = 'bold 14px "Courier New"';
            ctx.textAlign = 'center';
            ctx.fillText('ξ = 8.57', centerX, cosmosStartY - 200);
            ctx.font = '10px "Courier New"';
            ctx.fillStyle = 'rgba(255, 215, 0, 0.5)';
            ctx.fillText('(Acoplamiento no-mínimo)', centerX, cosmosStartY - 185);
        }
        
        // Dibujar galaxia espiral
        function drawSpiralGalaxy(x, y) {
            const grad = ctx.createRadialGradient(x, y, 0, x, y, 20);
            grad.addColorStop(0, 'rgba(255, 215, 0, 0.7)');
            grad.addColorStop(1, 'rgba(100, 150, 255, 0.2)');
            
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(x, y, 20, 0, Math.PI * 2);
            ctx.fill();
            
            // Brazos
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.4)';
            ctx.lineWidth = 1;
            
            for (let arm = 0; arm < 2; arm++) {
                ctx.beginPath();
                const armAngle = arm * Math.PI + time * 0.002;
                
                for (let r = 0; r < 25; r += 2) {
                    const spiralAngle = armAngle + (r / 25) * Math.PI * 2;
                    const px = x + r * Math.cos(spiralAngle);
                    const py = y + r * Math.sin(spiralAngle);
                    
                    if (r === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();
            }
        }
        
        // Espirales áureas de fondo
        function drawGoldenSpiralsBackground() {
            ctx.strokeStyle = 'rgba(184, 134, 11, 0.05)';
            ctx.lineWidth = 1;
            
            for (let spiral = 0; spiral < 3; spiral++) {
                ctx.beginPath();
                const rotation = (spiral * Math.PI * 2 / 3);
                
                for (let i = 0; i < 200; i++) {
                    const theta = (i / 10) + rotation;
                    const radius = 10 * Math.pow(phi, theta / Math.PI);
                    const x = centerX + radius * Math.cos(theta);
                    const y = centerY + radius * Math.sin(theta);
                    
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                    
                    if (radius > 400) break;
                }
                ctx.stroke();
            }
        }
        
        // Anotaciones científicas
        function drawAnnotations() {
            ctx.fillStyle = 'rgba(255, 215, 0, 0.6)';
            ctx.font = '11px "Courier New"';
            
            // Superior izquierda
            ctx.textAlign = 'left';
            ctx.fillText('ξ = 8.57 ± 0.28', 30, 50);
            ctx.font = '10px "Courier New"';
            ctx.fillStyle = 'rgba(255, 215, 0, 0.4)';
            ctx.fillText('(no-mínimo)', 30, 65);
            
            // Superior derecha
            ctx.font = '11px "Courier New"';
            ctx.fillStyle = 'rgba(255, 215, 0, 0.6)';
            ctx.textAlign = 'right';
            ctx.fillText('m_φ = 66.3 meV', canvas.width - 30, 50);
            ctx.font = '10px "Courier New"';
            ctx.fillStyle = 'rgba(255, 215, 0, 0.4)';
            ctx.fillText('(masa escalar)', canvas.width - 30, 65);
            
            // Inferior izquierda
            ctx.font = '11px "Courier New"';
            ctx.fillStyle = 'rgba(255, 215, 0, 0.6)';
            ctx.textAlign = 'left';
            ctx.fillText('q_born = 1.1910149', 30, canvas.height - 50);
            ctx.font = '10px "Courier New"';
            ctx.fillStyle = 'rgba(255, 215, 0, 0.4)';
            ctx.fillText('(deformación de Born)', 30, canvas.height - 35);
            
            // Inferior derecha
            ctx.font = '11px "Courier New"';
            ctx.fillStyle = 'rgba(255, 215, 0, 0.6)';
            ctx.textAlign = 'right';
            ctx.fillText('Φ_c = 0.6829322', canvas.width - 30, canvas.height - 50);
            ctx.font = '10px "Courier New"';
            ctx.fillStyle = 'rgba(255, 215, 0, 0.4)';
            ctx.fillText('(umbral conciencia)', canvas.width - 30, canvas.height - 35);
        }
        
        // Animación principal
        function animate() {
            // Fondo
            const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, '#0B0C10');
            bgGrad.addColorStop(0.5, '#0D1B2A');
            bgGrad.addColorStop(1, '#0B0C10');
            
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Elementos
            drawGoldenSpiralsBackground();
            drawPrimalField();
            drawEmergentMesh();
            drawOrganizedCosmos();
            drawAnnotations();
            
            time++;
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>
