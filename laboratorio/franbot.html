<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FranBot · Redirigiendo…</title>
<meta http-equiv="refresh" content="3;url=https://jaime393.github.io/FranBot">
<meta name="description" content="FranBot ahora vive en su propio repositorio. Redirigiendo…">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e0a;--bg2:#151b13;--line:#2a3324;
  --myco:#6dffb0;--ink:#ECE8D9;--ink-dim:#9aa392;
  --mono:'Space Mono','Courier New',monospace;
  --body:system-ui,sans-serif;
}
html,body{height:100%}
body{font-family:var(--body);background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
.card{background:var(--bg2);border:1px solid var(--line);border-top:3px solid var(--myco);border-radius:16px;padding:2.5rem 2rem;max-width:480px;width:100%;text-align:center}
.icon{font-size:3rem;margin-bottom:1rem;display:block}
h1{font-size:1.5rem;font-weight:700;margin-bottom:.6rem;color:var(--myco)}
p{color:var(--ink-dim);font-size:.9rem;line-height:1.6;margin-bottom:1.4rem}
.url{font-family:var(--mono);font-size:.75rem;color:var(--myco);word-break:break-all;margin-bottom:1.8rem;display:block}
a.btn{display:inline-block;background:var(--myco);color:#0a0e0a;font-weight:700;font-size:.85rem;padding:.8rem 1.6rem;border-radius:10px;text-decoration:none;transition:opacity .2s}
a.btn:hover{opacity:.85}
.back{display:block;margin-top:1.2rem;font-size:.78rem;color:var(--ink-dim)}
.back a{color:var(--ink-dim);text-decoration:underline}
.counter{font-family:var(--mono);font-size:.72rem;color:var(--ink-dim);margin-top:1rem;opacity:.7}
@media(prefers-reduced-motion:reduce){a.btn{transition:none}}
</style>
</head>
<body>
<div class="card">
  <span class="icon">🍄</span>
  <h1>FranBot se mudó</h1>
  <p>El nodo conversacional del MIU ahora vive en su propio repositorio. Serás redirigido automáticamente en <span id="n">3</span> segundos.</p>
  <span class="url">https://jaime393.github.io/FranBot</span>
  <a class="btn" href="https://jaime393.github.io/FranBot" rel="noopener">Ir a FranBot ↗</a>
  <span class="back"><a href="index.html">← Volver al Laboratorio</a></span>
  <p class="counter" id="msg"></p>
</div>
<script>
let t = 3;
const el = document.getElementById('n');
const msg = document.getElementById('msg');
const iv = setInterval(() => {
  t--;
  if(el) el.textContent = t;
  if(t <= 0){
    clearInterval(iv);
    if(msg) msg.textContent = 'Redirigiendo…';
    window.location.replace('https://jaime393.github.io/FranBot');
  }
}, 1000);
</script>
</body>
</html>
